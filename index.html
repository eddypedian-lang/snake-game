<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Premium Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a0e1a;
      --bg-mid: #111827;
      --panel: rgba(255,255,255,0.05);
      --panel-border: rgba(255,255,255,0.1);
      --text: #edf3ff;
      --muted: rgba(237,243,255,0.7);
      --grad-1: #00d4ff;
      --grad-2: #a855f7;
      --grad-3: #ec4899;
      --cyan: #00d4ff;
      --purple: #a855f7;
      --pink: #ec4899;
      --danger: #ff5d8f;
      --shadow: rgba(0,212,255,0.5);
      --success: #7ef9c6;
      --grid: rgba(255,255,255,0.035);
      --dark-cell: rgba(7, 10, 18, 0.9);
      --canvas-size: 500px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(0,212,255,0.18), transparent 20%),
        radial-gradient(circle at 80% 10%, rgba(168,85,247,0.15), transparent 22%),
        radial-gradient(circle at 50% 80%, rgba(236,72,153,0.18), transparent 22%),
        var(--bg-deep);
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -25%;
      background: linear-gradient(120deg, rgba(0,212,255,0.1), rgba(168,85,247,0.12), rgba(236,72,153,0.1), rgba(0,212,255,0.12));
      filter: blur(80px);
      animation: gradientShift 15s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      animation-duration: 18s;
      transform: scale(1.15) rotate(18deg);
      opacity: 0.7;
    }

    @keyframes gradientShift {
      0% {
        transform: translate3d(-4%, -3%, 0) scale(1) rotate(0deg);
      }
      50% {
        transform: translate3d(3%, 5%, 0) scale(1.12) rotate(12deg);
      }
      100% {
        transform: translate3d(-2%, 2%, 0) scale(1.08) rotate(-8deg);
      }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(92vw, 760px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 18px 0 8px;
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.3rem, 4vw, 4rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 800;
      background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 25px rgba(0,212,255,0.32);
      line-height: 1;
    }

    .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(237,243,255,0.75);
      opacity: 0.9;
    }

    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      gap: 18px;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 18px 40px rgba(0,0,0,0.2);
    }

    .score-card {
      border-radius: 20px;
      padding: 18px 22px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
    }

    .score-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(168,85,247,0.06), rgba(236,72,153,0.08));
      pointer-events: none;
    }

    .score-label {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    .score-value {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      line-height: 1;
      position: relative;
      z-index: 1;
      background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(168,85,247,0.28);
    }

    .game-wrap {
      position: relative;
      width: fit-content;
      padding: 12px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(168,85,247,0.15), rgba(236,72,153,0.12));
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 0 25px rgba(0,212,255,0.18),
        0 30px 55px rgba(9, 12, 24, 0.35);
    }

    .game-wrap::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: conic-gradient(from 0deg, rgba(0,212,255,0.9), rgba(168,85,247,0.95), rgba(236,72,153,0.9), rgba(0,212,255,0.9));
      z-index: -1;
      filter: blur(8px);
      opacity: 0.85;
    }

    canvas {
      display: block;
      width: var(--canvas-size);
      height: var(--canvas-size);
      background: rgba(10,14,26,0.9);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.02),
        0 10px 30px rgba(0,0,0,0.26);
      touch-action: none;
      position: relative;
      z-index: 1;
      transition: transform 0.2s ease;
    }

    .keyboard-hint {
      position: absolute;
      right: 18px;
      bottom: 18px;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      background: rgba(10,14,26,0.55);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 12px;
      backdrop-filter: blur(10px);
    }

    .controls {
      display: none;
      width: min(90vw, 350px);
      justify-content: center;
      align-items: center;
      margin-top: 4px;
    }

    .dpad {
      position: relative;
      width: 200px;
      height: 200px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      align-items: center;
      justify-items: center;
    }

    .dpad button {
      width: 62px;
      height: 62px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      box-shadow: 0 0 0 rgba(0,0,0,0);
      position: relative;
      overflow: hidden;
    }

    .dpad button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(168,85,247,0.08), rgba(236,72,153,0.12));
      opacity: 0.7;
    }

    .dpad button span {
      position: relative;
      z-index: 1;
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.08em;
    }

    .dpad button:active,
    .dpad button.active {
      transform: scale(0.96);
      box-shadow: 0 0 24px rgba(0,212,255,0.35), 0 0 16px rgba(168,85,247,0.2);
      background: rgba(255,255,255,0.08);
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 3; }

    footer {
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
      padding-bottom: 8px;
      color: rgba(255,255,255,0.8);
    }

    .developer-name {
      background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(0,212,255,0.2);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 11, 20, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: min(90vw, 430px);
      padding: 32px 26px 24px;
      border-radius: 24px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 26px rgba(168,85,247,0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .modal-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(168,85,247,0.08), rgba(236,72,153,0.08));
      pointer-events: none;
    }

    .modal-card > * {
      position: relative;
      z-index: 1;
    }

    .game-over {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 22px rgba(0,212,255,0.2);
      margin-bottom: 18px;
    }

    .final-score-wrap {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 18px 0 24px;
      flex-wrap: wrap;
    }

    .final-score-box {
      min-width: 120px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .final-score-label {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .final-score-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .play-again-btn {
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0,212,255,0.38), 0 0 18px rgba(168,85,247,0.2);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .play-again-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 34px rgba(0,212,255,0.5), 0 0 22px rgba(236,72,153,0.28);
    }

    .glow {
      box-shadow: 0 0 30px rgba(0,212,255,0.5);
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    @media (max-width: 767px) {
      body {
        overflow: hidden;
      }

      .app {
        width: min(95vw, 480px);
        padding-top: 14px;
        gap: 14px;
      }

      .scoreboard {
        width: min(90vw, 350px);
      }

      :root {
        --canvas-size: min(90vw, 400px);
      }

      .game-wrap {
        padding: 10px;
      }

      .keyboard-hint {
        display: none;
      }

      .controls {
        display: flex;
      }

      footer {
        letter-spacing: 0.18em;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">SNAKE</div>
      <div class="subtitle">PREMIUM EDITION</div>
    </header>

    <section class="scoreboard">
      <div class="score-card glass">
        <div class="score-label">Score</div>
        <div id="scoreValue" class="score-value">0</div>
      </div>
      <div class="score-card glass">
        <div class="score-label">Best</div>
        <div id="bestValue" class="score-value">0</div>
      </div>
    </section>

    <main class="game-wrap">
      <canvas id="gameCanvas" width="500" height="500"></canvas>
      <div class="keyboard-hint">Arrow / WASD</div>
    </main>

    <section class="controls" aria-label="Touch controls">
      <div class="dpad">
        <button class="btn-up" data-dir="up" aria-label="Up"><span>UP</span></button>
        <button class="btn-left" data-dir="left" aria-label="Left"><span>LEFT</span></button>
        <button class="btn-right" data-dir="right" aria-label="Right"><span>RIGHT</span></button>
        <button class="btn-down" data-dir="down" aria-label="Down"><span>DOWN</span></button>
      </div>
    </section>

    <footer>
      <span class="developer-name">Developed by IKY</span>
    </footer>
  </div>

  <div class="modal" id="gameOverModal" aria-hidden="true">
    <div class="modal-card glass">
      <div class="game-over">Game Over</div>
      <div class="final-score-wrap">
        <div class="final-score-box">
          <div class="final-score-label">Final Score</div>
          <div id="finalScore" class="final-score-value">0</div>
        </div>
        <div class="final-score-box">
          <div class="final-score-label">Best Score</div>
          <div id="bestScoreFinal" class="final-score-value">0</div>
        </div>
      </div>
      <button class="play-again-btn" id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreValue = document.getElementById('scoreValue');
    const bestValue = document.getElementById('bestValue');
    const finalScore = document.getElementById('finalScore');
    const bestScoreFinal = document.getElementById('bestScoreFinal');
    const gameOverModal = document.getElementById('gameOverModal');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const dpadButtons = document.querySelectorAll('[data-dir]');

    const gridSize = 20;
    const cellSize = canvas.width / gridSize;

    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let best = Number(localStorage.getItem('snakeBest')) || 0;
    let lastTimestamp = 0;
    let accumulator = 0;
    let speed = 120;
    let isRunning = true;
    let animationFrameId = null;
    let screenShakeTime = 0;
    let particles = [];
    let trail = [];

    bestValue.textContent = best;

    function setScore() {
      scoreValue.textContent = score;
      bestValue.textContent = best;
    }

    function playBeep(freq, duration) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      const audioContext = new AudioContextClass();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.value = freq;

      gainNode.gain.setValueAtTime(0.0001, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.08, audioContext.currentTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
      oscillator.onended = () => audioContext.close();
    }

    function playEatSound() {
      playBeep(880, 0.08);
    }

    function playGameOverSound() {
      const notes = [220, 180, 140];
      notes.forEach((freq, index) => {
        setTimeout(() => playBeep(freq, 0.18), index * 90);
      });
    }

    function buildSnakeStart() {
      const startX = Math.floor(gridSize / 2);
      const startY = Math.floor(gridSize / 2);

      return [
        { x: startX, y: startY },
        { x: startX - 1, y: startY },
        { x: startX - 2, y: startY }
      ];
    }

    function randomRange(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function spawnFood() {
      let newFood = {
        x: randomRange(0, gridSize - 1),
        y: randomRange(0, gridSize - 1)
      };

      while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y)) {
        newFood = {
          x: randomRange(0, gridSize - 1),
          y: randomRange(0, gridSize - 1)
        };
      }

      food = newFood;
    }

    function init() {
      snake = buildSnakeStart();
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      speed = 120;
      isRunning = true;
      lastTimestamp = 0;
      accumulator = 0;
      particles = [];
      trail = [];
      screenShakeTime = 0;
      setScore();
      spawnFood();
      gameOverModal.classList.remove('active');
      gameOverModal.setAttribute('aria-hidden', 'true');
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function updateParticles() {
      particles = particles.filter((particle) => particle.life > 0);
      particles.forEach((particle) => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vx *= 0.96;
        particle.vy *= 0.96;
        particle.life -= 0.02;
      });
    }

    function createBurst(x, y, color) {
      for (let i = 0; i < 18; i++) {
        const angle = (Math.PI * 2 * i) / 18;
        const velocity = 1 + Math.random() * 2.4;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity,
          life: 1,
          color
        });
      }
    }

    function handleInput(event) {
      const key = event.key.toLowerCase();
      const nextMap = {
        arrowup: { x: 0, y: -1 },
        w: { x: 0, y: -1 },
        arrowdown: { x: 0, y: 1 },
        s: { x: 0, y: 1 },
        arrowleft: { x: -1, y: 0 },
        a: { x: -1, y: 0 },
        arrowright: { x: 1, y: 0 },
        d: { x: 1, y: 0 }
      };

      const desired = nextMap[key];
      if (!desired) return;

      event.preventDefault();

      const isOpposite =
        desired.x === -direction.x && desired.y === -direction.y;

      if (!isOpposite) {
        nextDirection = desired;
      }
    }

    function handleSwipe() {
      let touchStartX = 0;
      let touchStartY = 0;

      canvas.addEventListener('touchstart', (event) => {
        const touch = event.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      canvas.addEventListener('touchend', (event) => {
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;

        if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;

        if (Math.abs(dx) > Math.abs(dy)) {
          nextDirection = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
        } else {
          nextDirection = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
        }

        if (nextDirection.x === -direction.x && nextDirection.y === -direction.y) {
          nextDirection = direction;
        }
      }, { passive: true });
    }

    function update() {
      direction = nextDirection;

      let nextHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      nextHead.x = (nextHead.x + gridSize) % gridSize;
      nextHead.y = (nextHead.y + gridSize) % gridSize;

      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === nextHead.x && snake[i].y === nextHead.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(nextHead);
      trail.push({ x: nextHead.x, y: nextHead.y, alpha: 1 });

      if (nextHead.x === food.x && nextHead.y === food.y) {
        score += 10;
        speed = Math.max(60, speed - 5);
        best = Math.max(best, score);
        localStorage.setItem('snakeBest', String(best));
        setScore();
        spawnFood();
        createBurst(food.x + 0.5, food.y + 0.5, '#ff7ab6');
        playEatSound();
      } else {
        snake.pop();
      }

      if (trail.length > 18) {
        trail.shift();
      }

      trail.forEach((point, index) => {
        point.alpha = Math.max(0, 1 - index / trail.length);
      });
    }

    function drawCell(x, y, width, height, fillStyle) {
      ctx.fillStyle = fillStyle;
      ctx.fillRect(x, y, width, height);
    }

    function drawBackground() {
      ctx.fillStyle = '#0a0e1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let x = 0; x < gridSize; x++) {
        for (let y = 0; y < gridSize; y++) {
          ctx.strokeStyle = 'rgba(255,255,255,0.025)';
          ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
        }
      }
    }

    function drawFood() {
      const pulse = 0.65 + Math.sin(Date.now() * 0.012) * 0.25;
      const radius = cellSize * (0.34 + pulse * 0.12);

      const gradient = ctx.createRadialGradient(
        food.x * cellSize + cellSize / 2,
        food.y * cellSize + cellSize / 2,
        2,
        food.x * cellSize + cellSize / 2,
        food.y * cellSize + cellSize / 2,
        radius * 1.8
      );

      gradient.addColorStop(0, '#d7f9ff');
      gradient.addColorStop(0.2, '#a0f9ff');
      gradient.addColorStop(0.55, '#ec4899');
      gradient.addColorStop(1, '#7c3aed');

      ctx.beginPath();
      ctx.fillStyle = gradient;
      ctx.shadowBlur = 20;
      ctx.shadowColor = 'rgba(236,72,153,0.7)';
      ctx.arc(
        food.x * cellSize + cellSize / 2,
        food.y * cellSize + cellSize / 2,
        radius,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawTrail() {
      trail.forEach((segment, index) => {
        const alpha = (index + 1) / trail.length;
        const x = segment.x * cellSize + 2;
        const y = segment.y * cellSize + 2;
        const itemSize = cellSize - 4;

        ctx.fillStyle = `rgba(0, 212, 255, ${0.08 + alpha * 0.14})`;
        ctx.fillRect(x, y, itemSize, itemSize);
      });
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        const x = segment.x * cellSize + 2;
        const y = segment.y * cellSize + 2;
        const size = cellSize - 4;

        const headRatio = index === 0 ? 1 : 0.22 + (index / snake.length) * 0.7;
        const gradient = ctx.createLinearGradient(x, y, x + size, y + size);

        gradient.addColorStop(0, index === 0 ? '#dffcff' : '#67e8f9');
        gradient.addColorStop(0.45, index === 0 ? '#7dd3fc' : '#4ec7ff');
        gradient.addColorStop(1, index === 0 ? '#a855f7' : '#8b5cf6');

        ctx.fillStyle = gradient;
        ctx.shadowBlur = index === 0 ? 16 : 8;
        ctx.shadowColor = index === 0 ? 'rgba(0,212,255,0.8)' : 'rgba(168,85,247,0.6)';
        roundRect(ctx, x, y, size, size, 8);
        ctx.fill();

        if (index === 0) {
          const eyeSize = Math.max(2, cellSize * 0.09);
          const eyeOffset = cellSize * 0.12;

          ctx.fillStyle = '#0a0e1a';
          ctx.beginPath();
          if (direction.x === 1) {
            ctx.arc(x + size * 0.72, y + size * 0.34, eyeSize, 0, Math.PI * 2);
            ctx.arc(x + size * 0.72, y + size * 0.66, eyeSize, 0, Math.PI * 2);
          } else if (direction.x === -1) {
            ctx.arc(x + size * 0.28, y + size * 0.34, eyeSize, 0, Math.PI * 2);
            ctx.arc(x + size * 0.28, y + size * 0.66, eyeSize, 0, Math.PI * 2);
          } else if (direction.y === -1) {
            ctx.arc(x + size * 0.34, y + size * 0.28, eyeSize, 0, Math.PI * 2);
            ctx.arc(x + size * 0.66, y + size * 0.28, eyeSize, 0, Math.PI * 2);
          } else {
            ctx.arc(x + size * 0.34, y + size * 0.72, eyeSize, 0, Math.PI * 2);
            ctx.arc(x + size * 0.66, y + size * 0.72, eyeSize, 0, Math.PI * 2);
          }
          ctx.fill();
        }

        ctx.shadowBlur = 0;
      });
    }

    function drawParticles() {
      particles.forEach((particle) => {
        ctx.beginPath();
        ctx.fillStyle = `rgba(${hexToRgb(particle.color).join(',')},${particle.life})`;
        ctx.arc(particle.x * cellSize + 10, particle.y * cellSize + 10, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function hexToRgb(hex) {
      const value = hex.replace('#', '');
      const bigint = parseInt(value, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return [r, g, b];
    }

    function roundRect(context, x, y, width, height, radius) {
      context.beginPath();
      context.moveTo(x + radius, y);
      context.lineTo(x + width - radius, y);
      context.quadraticCurveTo(x + width, y, x + width, y + radius);
      context.lineTo(x + width, y + height - radius);
      context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      context.lineTo(x + radius, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - radius);
      context.lineTo(x, y + radius);
      context.quadraticCurveTo(x, y, x + radius, y);
      context.closePath();
    }

    function draw() {
      ctx.save();
      if (screenShakeTime > 0) {
        const offsetX = (Math.random() - 0.5) * 8;
        const offsetY = (Math.random() - 0.5) * 8;
        ctx.translate(offsetX, offsetY);
        screenShakeTime -= 16;
      }

      drawBackground();
      drawTrail();
      drawFood();
      drawSnake();
      drawParticles();
      ctx.restore();
    }

    function gameOver() {
      isRunning = false;
      playGameOverSound();
      best = Math.max(best, score);
      localStorage.setItem('snakeBest', String(best));
      setScore();

      finalScore.textContent = score;
      bestScoreFinal.textContent = best;

      gameOverModal.classList.add('active');
      gameOverModal.setAttribute('aria-hidden', 'false');

      screenShakeTime = 300;
      cancelAnimationFrame(animationFrameId);

      setTimeout(() => {
        const currentBest = Number(localStorage.getItem('snakeBest')) || 0;
        bestValue.textContent = currentBest;
      }, 50);
    }

    function gameLoop(timestamp) {
      if (!isRunning) return;

      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      accumulator += delta;

      if (accumulator >= speed) {
        update();
        accumulator = 0;
      }

      draw();
      updateParticles();

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function setDirectionFromButton(buttonValue) {
      const map = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      const desired = map[buttonValue];
      if (!desired) return;

      const isOpposite =
        desired.x === -direction.x && desired.y === -direction.y;

      if (!isOpposite) {
        nextDirection = desired;
      }
    }

    dpadButtons.forEach((button) => {
      button.addEventListener('click', () => {
        setDirectionFromButton(button.dataset.dir);
      });
    });

    document.addEventListener('keydown', handleInput);

    playAgainBtn.addEventListener('click', () => {
      init();
    });

    handleSwipe();

    init();
  </script>
</body>
</html>
